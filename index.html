<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>IMU Live — gyro & accel</title>
    <style>
      :root {
        --bg: #071426;
        --card: #072033;
        --card-2: #0b2230;
        --accent1: #06b6d4;
        --accent2: #7c3aed;
        --muted: #9fb3c8;
        --glass: rgba(255, 255, 255, 0.04);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial;
        color: #e6eef6;
        background: linear-gradient(180deg, var(--bg) 0%, #021420 100%);
      }

      .wrap {
        max-width: 980px;
        margin: 18px auto;
        padding: 12px;
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 18px;
        width: calc(100% - 24px);
      }
      .panel {
        background: linear-gradient(180deg, var(--card), var(--card-2));
        border-radius: 14px;
        padding: 14px;
        box-shadow: 0 8px 30px rgba(2, 8, 18, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.03);
      }

      .left {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      button {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.02),
          rgba(255, 255, 255, 0.01)
        );
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: inherit;
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.3s, color 0.3s;
      }
      button:active {
        transform: translateY(1px);
      }
      button.active {
        background-color: var(--accent1);
        color: #000;
      }
      .small {
        font-size: 13px;
        color: var(--muted);
      }

      .dot-area {
        position: relative;
        min-height: 320px;
        border-radius: 12px;
        overflow: hidden;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.02),
          transparent
        );
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dot {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 56px;
        height: 56px;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--accent1), var(--accent2));
        box-shadow: 0 18px 40px rgba(12, 52, 68, 0.35),
          inset 0 -8px 22px rgba(255, 255, 255, 0.03);
        transition: transform 0.08s linear, left 0.08s linear, top 0.08s linear;
      }

      .readouts {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: Menlo, Monaco, monospace;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.01),
          transparent
        );
        padding: 8px;
        border-radius: 8px;
      }
      .col-right {
        padding-left: 10px;
        color: #e6eef6;
      }
      h3 {
        margin: 0 0 10px 0;
      }
      .notes {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.4;
      }

      @media (max-width: 820px) {
        .wrap {
          grid-template-columns: 1fr;
          gap: 12px;
        }
        .panel {
          padding: 12px;
        }
        .dot-area {
          min-height: 220px;
        }
        .dot {
          width: 48px;
          height: 48px;
        }
        .readouts {
          order: -1;
        }
      }
      @media (max-width: 480px) {
        .dot-area {
          min-height: 200px;
        }
        .dot {
          width: 40px;
          height: 40px;
        }
        .controls button {
          padding: 10px;
        }
        .row {
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="mainContainer">
      <div class="wrap">
        <div class="panel left">
          <div class="controls">
            <button id="btToggle">Bluetooth: OFF</button>
            <button id="gyroToggle" aria-pressed="true">Gyro: ON</button>
            <button id="accelToggle" aria-pressed="true">Accel: ON</button>
            <button id="ctrlMode">CTRL MODE</button>
            <div class="small" id="status">idle</div>
          </div>

          <div class="dot-area" id="stage">
            <div class="dot" id="dot"></div>
          </div>

          <div class="notes small">
            Tip: Open on an Android device with Chrome over HTTPS for full
            sensor and Bluetooth functionality.
          </div>
        </div>

        <div class="panel right">
          <h3>Live Sensor Readout</h3>
          <div class="readouts">
            <div class="row">
              <div>Accel X</div>
              <div class="col-right" id="ax">—</div>
            </div>
            <div class="row">
              <div>Accel Y</div>
              <div class="col-right" id="ay">—</div>
            </div>
            <div class="row">
              <div>Accel Z</div>
              <div class="col-right" id="az">—</div>
            </div>
            <div style="height: 8px"></div>
            <div class="row">
              <div>Gyro X</div>
              <div class="col-right" id="gx">—</div>
            </div>
            <div class="row">
              <div>Gyro Y</div>
              <div class="col-right" id="gy">—</div>
            </div>
            <div class="row">
              <div>Gyro Z</div>
              <div class="col-right" id="gz">—</div>
            </div>
            <div style="height: 8px"></div>
            <div class="row">
              <div>Source</div>
              <div class="col-right" id="source">—</div>
            </div>
            <div class="row">
              <div>Timestamp</div>
              <div class="col-right" id="ts">—</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      id="ctrlPanel"
      class="panel"
      style="display: none; margin: 18px auto; max-width: 760px"
    >
      <!-- Content for CTRL MODE -->
    </div>

    <script>
      (() => {
        const btToggleBtn = document.getElementById("btToggle");
        const gyroToggle = document.getElementById("gyroToggle");
        const accelToggle = document.getElementById("accelToggle");
        const dot = document.getElementById("dot");
        const stage = document.getElementById("stage");

        const axEl = document.getElementById("ax");
        const ayEl = document.getElementById("ay");
        const azEl = document.getElementById("az");
        const gxEl = document.getElementById("gx");
        const gyEl = document.getElementById("gy");
        const gzEl = document.getElementById("gz");
        const tsEl = document.getElementById("ts");
        const sourceEl = document.getElementById("source");

        let bleDevice = null;
        let txChar = null;

        let sensors = { gyro: null, accel: null };
        let lastReading = { ax: 0, ay: 0, az: 0, gx: 0, gy: 0, gz: 0 };
        let uiState = { gyroOn: true, accelOn: true, sensorsRunning: false };
        let dmListener = null;

        const fmt = (v, n = 2) => (typeof v === "number" ? v.toFixed(n) : "—");

        async function toggleBluetooth() {
          if (bleDevice && bleDevice.gatt.connected) {
            await bleDevice.gatt.disconnect();
            btToggleBtn.textContent = "Bluetooth: OFF";
            btToggleBtn.classList.remove("active");
            bleDevice = null;
            txChar = null;
          } else {
            try {
              btToggleBtn.textContent = "Connecting...";
              const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
              });
              device.addEventListener("gattserverdisconnected", () => {
                btToggleBtn.textContent = "Bluetooth: OFF";
                btToggleBtn.classList.remove("active");
                bleDevice = null;
                txChar = null;
              });
              const server = await device.gatt.connect();
              const services = await server.getPrimaryServices();
              for (const service of services) {
                const characteristics = await service.getCharacteristics();
                for (const char of characteristics) {
                  if (
                    char.properties.write ||
                    char.properties.writeWithoutResponse
                  ) {
                    txChar = char;
                    break;
                  }
                }
                if (txChar) break;
              }
              if (!txChar) throw new Error("No writable characteristic found.");

              bleDevice = device;
              btToggleBtn.textContent = "Bluetooth: ON";
              btToggleBtn.classList.add("active");
            } catch (error) {
              alert("Bluetooth connection failed: " + error.message);
              btToggleBtn.textContent = "Bluetooth: OFF";
            }
          }
        }

        function updateUIToggles() {
          gyroToggle.textContent = `Gyro: ${uiState.gyroOn ? "ON" : "OFF"}`;
          accelToggle.textContent = `Accel: ${uiState.accelOn ? "ON" : "OFF"}`;
          gyroToggle.classList.toggle("active", uiState.gyroOn);
          accelToggle.classList.toggle("active", uiState.accelOn);

          if (uiState.gyroOn || uiState.accelOn) {
            if (!uiState.sensorsRunning) startSensors();
          } else {
            if (uiState.sensorsRunning) stopSensors();
          }
        }

        function moveDot() {
          const rect = stage.getBoundingClientRect();
          const cx = rect.width / 2;
          const cy = rect.height / 2;

          let moveX = 0,
            moveY = 0;

          if (uiState.accelOn) {
            moveX += lastReading.ax;
            moveY += lastReading.ay;
          }
          if (uiState.gyroOn) {
            moveX += lastReading.gx * 5; // Gyro values need scaling
            moveY += lastReading.gy * 5;
          }

          const sx = Math.max(-1, Math.min(1, moveX / 9.81));
          const sy = Math.max(-1, Math.min(1, moveY / 9.81));

          dot.style.left = `${cx + sx * (rect.width / 2 - 30)}px`;
          dot.style.top = `${cy - sy * (rect.height / 2 - 30)}px`; // Invert Y for natural movement
        }

        async function startSensors() {
          try {
            if (!("Gyroscope" in window && "Accelerometer" in window)) {
              if ("DeviceMotionEvent" in window) {
                dmListener = (e) => {
                  const acc = e.accelerationIncludingGravity;
                  const rot = e.rotationRate;
                  lastReading = {
                    ax: acc.x,
                    ay: acc.y,
                    az: acc.z,
                    gx: rot.beta,
                    gy: rot.alpha,
                    gz: rot.gamma,
                  };
                  updateReadouts();
                };
                const p = await DeviceMotionEvent.requestPermission?.();
                if (p === "denied") {
                  alert("Sensor permission denied.");
                  return;
                }
                window.addEventListener("devicemotion", dmListener);
                sourceEl.textContent = "DeviceMotion";
              } else {
                throw new Error("Sensor APIs not supported.");
              }
            } else {
              sensors.accel = new Accelerometer({ frequency: 60 });
              sensors.accel.addEventListener("reading", () => {
                lastReading.ax = sensors.accel.x;
                lastReading.ay = sensors.accel.y;
                lastReading.az = sensors.accel.z;
                updateReadouts();
              });
              await sensors.accel.start();

              sensors.gyro = new Gyroscope({ frequency: 60 });
              sensors.gyro.addEventListener("reading", () => {
                lastReading.gx = sensors.gyro.x;
                lastReading.gy = sensors.gyro.y;
                lastReading.gz = sensors.gyro.z;
                updateReadouts();
              });
              await sensors.gyro.start();
              sourceEl.textContent = "Generic Sensor";
            }
            uiState.sensorsRunning = true;
          } catch (error) {
            alert(`Could not start sensors: ${error.message}`);
            uiState.sensorsRunning = false;
          }
        }

        function stopSensors() {
          sensors.gyro?.stop();
          sensors.accel?.stop();
          if (dmListener)
            window.removeEventListener("devicemotion", dmListener);
          sensors = { gyro: null, accel: null };
          dmListener = null;
          uiState.sensorsRunning = false;
          resetReadouts();
        }

        function updateReadouts() {
          if (!uiState.sensorsRunning) return;
          axEl.textContent = fmt(lastReading.ax);
          ayEl.textContent = fmt(lastReading.ay);
          azEl.textContent = fmt(lastReading.az);
          gxEl.textContent = fmt((lastReading.gx * 180) / Math.PI);
          gyEl.textContent = fmt((lastReading.gy * 180) / Math.PI);
          gzEl.textContent = fmt((lastReading.gz * 180) / Math.PI);
          tsEl.textContent = Date.now();
          moveDot();
        }

        function resetReadouts() {
          axEl.textContent = ayEl.textContent = azEl.textContent = "—";
          gxEl.textContent = gyEl.textContent = gzEl.textContent = "—";
        }

        btToggleBtn.addEventListener("click", toggleBluetooth);
        gyroToggle.addEventListener("click", () => {
          uiState.gyroOn = !uiState.gyroOn;
          updateUIToggles();
        });
        accelToggle.addEventListener("click", () => {
          uiState.accelOn = !uiState.accelOn;
          updateUIToggles();
        });

        // Initial setup
        updateUIToggles();
        if (uiState.gyroOn || uiState.accelOn) {
          startSensors();
        }
      })();
    </script>
  </body>
</html>
