<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BLE test — Web Bluetooth diagnostics</title>
    <style>
      body {
        font-family: system-ui, Arial;
        margin: 18px;
        background: #071020;
        color: #e6eef6;
      }
      button {
        padding: 10px 14px;
        margin: 6px;
        border-radius: 8px;
        background: #06202a;
        color: #cfeff4;
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .log {
        margin-top: 12px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 8px;
        max-width: 720px;
        word-break: break-word;
      }
      .hint {
        color: #9ca3af;
        font-size: 0.95rem;
        margin-top: 8px;
      }
      .ok {
        color: #7ee6b8;
      }
      .bad {
        color: #ff9b9b;
      }
    </style>
  </head>
  <body>
    <h2>Web Bluetooth diagnostics</h2>
    <div>
      <button id="check">Check support</button>
      <input id="filterInput" placeholder="service UUID or namePrefix (optional)" style="padding:8px; margin:6px; width:220px; border-radius:6px; border:1px solid rgba(255,255,255,0.06); background:transparent; color:#e6eef6">
      <button id="connect">Connect BLE (chooser)</button>
      <button id="connectAny">Connect any device</button>
      <button id="disconnect" disabled>Disconnect</button>
    </div>

    <div class="hint" id="contextInfo"></div>
    <div class="log" id="log">Log: idle</div>

    <script>
      const logEl = document.getElementById("log");
      const ctxEl = document.getElementById("contextInfo");
      const checkBtn = document.getElementById("check");
      const connectBtn = document.getElementById("connect");
      const disconnectBtn = document.getElementById("disconnect");

      function log(...args) {
        const s = args
          .map((a) => (typeof a === "object" ? JSON.stringify(a) : String(a)))
          .join(" ");
        console.log("BLE:", s);
        logEl.textContent = "Log: " + s;
      }

      function setContext(msg) {
        ctxEl.innerHTML = msg;
      }

      function showBasicInfo() {
        setContext(
          `Secure context: <strong>${
            window.isSecureContext
              ? '<span class="ok">yes</span>'
              : '<span class="bad">no</span>'
          }</strong>` +
            ` — navigator.bluetooth: <strong>${
              navigator.bluetooth
                ? '<span class="ok">present</span>'
                : '<span class="bad">missing</span>'
            }</strong>` +
            `<br>User agent: <code>${navigator.userAgent}</code>`
        );
      }

      // core check
      checkBtn.addEventListener("click", () => {
        showBasicInfo();
        if (!navigator.bluetooth) {
          log("navigator.bluetooth not available in this browser build.");
          log(
            "Tip: Opera mobile builds vary — try Chrome for Android for best Web Bluetooth compatibility."
          );
          return;
        }
        log(
          "navigator.bluetooth present; secure context=" +
            window.isSecureContext
        );
        // If not secure, immediately tell user
        if (!window.isSecureContext) {
          log(
            "Page is not secure. Serve over HTTPS or use localhost for testing."
          );
        }
      });

      // attempt connect: NUS first, then acceptAllDevices fallback
      let device = null,
        server = null,
        txChar = null;
      const NUS = {
        service: "6e400001-b5a3-f393-e0a9-e50e24dcca9e",
        tx: "6e400002-b5a3-f393-e0a9-e50e24dcca9e",
      };

      connectBtn.addEventListener("click", async () => {
        log("User gesture: opening device chooser...");
        if (!navigator.bluetooth) {
          log("navigator.bluetooth missing — cannot proceed.");
          return;
        }
        try {
          // Try filtered chooser
          try {
            device = await navigator.bluetooth.requestDevice({
              filters: [{ services: [NUS.service] }],
              optionalServices: [NUS.service],
            });
            log("Device selected (filtered):", device.name || device.id);
          } catch (e) {
            log("Filtered chooser fallback:", e && e.message ? e.message : e);
            // fallback to acceptAllDevices so user sees chooser
            device = await navigator.bluetooth.requestDevice({
              acceptAllDevices: true,
              optionalServices: [NUS.service],
            });
            log(
              "Device selected (acceptAllDevices):",
              device.name || device.id
            );
          }

          device.addEventListener("gattserverdisconnected", () => {
            log("Device disconnected");
            disconnectBtn.disabled = false;
            connectBtn.disabled = false;
          });
          log("Connecting to GATT...");
          server = await device.gatt.connect();
          log("Connected. Discovering services...");

          // Prefer NUS service, else scan for any writable characteristic
          try {
            const svc = await server.getPrimaryService(NUS.service);
            txChar = await svc.getCharacteristic(NUS.tx);
            log("Found NUS TX characteristic", txChar.uuid);
          } catch (nusErr) {
            log(
              "NUS not found; scanning all services for writable characteristics..."
            );
            const services = await server.getPrimaryServices();
            for (const svc of services) {
              try {
                const chars = await svc.getCharacteristics();
                for (const c of chars) {
                  const p = c.properties || {};
                  if (p.write || p.writeWithoutResponse) {
                    txChar = c;
                    log("Selected writable char", {
                      service: svc.uuid,
                      char: c.uuid,
                      props: p,
                    });
                    break;
                  }
                }
                if (txChar) break;
              } catch (scanErr) {
                log("Error scanning service", svc.uuid, scanErr);
              }
            }
          }

          if (!txChar) {
            log(
              "No writable characteristic found. The peripheral might not expose a UART-like service. Try HM-10 or a BLE UART module."
            );
            return;
          }

          log("Ready to write; sending a test packet...");
          const sample = "TEST\n";
          await txChar.writeValue(new TextEncoder().encode(sample));
          log(
            "Write OK (test packet sent). Now the page will be able to write strings to the device using this characteristic."
          );

          connectBtn.disabled = true;
          disconnectBtn.disabled = false;
        } catch (err) {
          log(
            "Connection flow failed:",
            err && err.message ? err.message : err
          );
          if (err && err.name === "NotFoundError") {
            log("User cancelled the chooser or no device matched the filter.");
          } else if (err && err.name === "SecurityError") {
            log(
              "SecurityError: likely insecure origin (not HTTPS) or blocked by site settings."
            );
          } else if (err && err.name === "NotSupportedError") {
            log(
              "NotSupportedError: the characteristic method required is not supported on this UA/build."
            );
          }
        }
      });

      disconnectBtn.addEventListener("click", async () => {
        try {
          if (device && device.gatt && device.gatt.connected) {
            device.gatt.disconnect();
            log("Disconnected from device.");
          }
        } catch (e) {
          log("Disconnect error", e);
        }
        disconnectBtn.disabled = true;
        connectBtn.disabled = false;
      });

      showBasicInfo();
    </script>
  </body>
</html>
